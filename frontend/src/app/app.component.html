<!-- App Container -->
<ng-container *ngIf="authService.isLoggedIn(); else anonymousLayout">
  <mat-sidenav-container class="sidenav-container">
    <!-- Sidebar -->
    <mat-sidenav #sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile" class="sidenav">
      <div class="brand-section">
        <mat-icon class="brand-icon">account_balance</mat-icon>
        <span class="brand-name">Apex Bank</span>
      </div>
      
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a mat-list-item routerLink="/deposit" routerLinkActive="active-link">
          <mat-icon matListItemIcon>add_circle</mat-icon>
          <span matListItemTitle>Deposit Funds</span>
        </a>
        <a mat-list-item routerLink="/withdraw" routerLinkActive="active-link">
          <mat-icon matListItemIcon>remove_circle</mat-icon>
          <span matListItemTitle>Withdraw Funds</span>
        </a>
        <a mat-list-item routerLink="/transfer" routerLinkActive="active-link">
          <mat-icon matListItemIcon>swap_horiz</mat-icon>
          <span matListItemTitle>Fund Transfer</span>
        </a>
        <a mat-list-item routerLink="/transactions" routerLinkActive="active-link">
          <mat-icon matListItemIcon>history</mat-icon>
          <span matListItemTitle>Transaction History</span>
        </a>
        <a mat-list-item routerLink="/profile" routerLinkActive="active-link">
          <mat-icon matListItemIcon>person</mat-icon>
          <span matListItemTitle>My Profile</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <!-- Main Content Context -->
    <mat-sidenav-content class="content-wrapper">
      <!-- Toolbar -->
      <mat-toolbar color="primary" class="toolbar">
        <button mat-icon-button (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="spacer"></span>
        <span class="user-greeting">Welcome, {{ getUserName() }}</span>
        <button mat-icon-button (click)="logout()" title="Logout">
          <mat-icon>logout</mat-icon>
        </button>
      </mat-toolbar>

      <!-- Routing Context Area -->
      <main class="main-content">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>

<!-- Anonymous Layout (Login/Registration Context) -->
<ng-template #anonymousLayout>
  <router-outlet></router-outlet>
</ng-template>

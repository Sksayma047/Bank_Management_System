<div class="auth-wrapper">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title class="auth-title">Bank Management System</mat-card-title>
      <mat-card-subtitle>Login to manage your accounts</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Email field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email Address</mat-label>
          <input matInput type="email" formControlName="email" placeholder="e.g. john@example.com">
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Please enter a valid email address</mat-error>
        </mat-form-field>

        <!-- Password field -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Enter password">
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">Password must be at least 6 characters</mat-error>
        </mat-form-field>

        <!-- Submit and Loading -->
        <div class="action-row">
          <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-primary full-width">
            <span *ngIf="!isLoading">Login</span>
            <mat-spinner diameter="20" *ngIf="isLoading" color="accent" class="spinner-center"></mat-spinner>
          </button>
        </div>
      </form>
    </mat-card-content>
    
    <mat-card-actions class="auth-footer">
      <span>Don't have an account? </span>
      <a routerLink="/register">Register here</a>
    </mat-card-actions>
  </mat-card>
</div>
